name: Yui
options:
  bundleIdPrefix: com.yuigui
  deploymentTarget:
    iOS: "26.0"
packages:
  YuiLines:
    path: Packages/YuiLines
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${YUI_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Yui:
    type: application
    platform: iOS
    sources: [Yui/Sources, Yui/Resources]
    dependencies:
      - package: YuiLines
    entitlements:
      path: Yui/Yui.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Yui/Info.plist
      properties:
        CFBundleDisplayName: Yui
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
