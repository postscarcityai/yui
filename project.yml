name: Yui
options:
  bundleIdPrefix: com.yuigui
  deploymentTarget:
    iOS: "26.0"
packages:
  YuiLines:
    path: Packages/YuiLines
  # Native LaTeX (CoreText) for math, step and calc. MIT.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${YUI_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Yui:
    type: application
    platform: iOS
    sources: [Yui/Sources, Yui/Resources]
    dependencies:
      - package: YuiLines
      - package: SwiftMath
    entitlements:
      path: Yui/Yui.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Xcode signs Debug with development; archive/export for TestFlight turns it into production.
        aps-environment: development
    info:
      path: Yui/Info.plist
      properties:
        CFBundleDisplayName: Yui
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Your agents can ask for a photo, like your plate or a receipt. Yui sends it only to the agent that asked.
        # yui://agent/<id>/thread opens that agent's thread (push taps, links from other channels).
        CFBundleURLTypes:
          - CFBundleURLName: com.yuigui.app
            CFBundleURLSchemes: [yui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [YuiUITests]
  YuiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YuiUITests]
    dependencies:
      - target: Yui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yui
