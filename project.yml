name: Yui
options:
  bundleIdPrefix: com.yuigui
  deploymentTarget:
    iOS: "26.0"
packages:
  YuiLines:
    path: Packages/YuiLines
  # Native LaTeX (CoreText) for math, step and calc. MIT.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${YUI_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Yui:
    type: application
    platform: iOS
    sources: [Yui/Sources, Yui/Resources]
    dependencies:
      - package: YuiLines
      - package: SwiftMath
    entitlements:
      path: Yui/Yui.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Xcode signs Debug with development; archive/export for TestFlight turns it into production.
        aps-environment: development
    info:
      path: Yui/Info.plist
      properties:
        CFBundleDisplayName: Yui
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Send a photo to an agent, or take one when it asks, like your plate or a receipt. Yui sends it only to the agent in that thread.
        NSMicrophoneUsageDescription: Hold the mic to talk to your agent. Yui turns your words into text on your phone and sends the text.
        NSSpeechRecognitionUsageDescription: Hold the mic to talk to your agent. Your words become text on your phone before they are sent.
        # yui://agent/<id>/thread opens that agent's thread (push taps, links from other channels).
        CFBundleURLTypes:
          - CFBundleURLName: com.yuigui.app
            CFBundleURLSchemes: [yui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [YuiTests, YuiUITests]
  # Unit tests hosted in the app (the chat store, answers on reopen).
  YuiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YuiTests]
    dependencies:
      - target: Yui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  YuiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YuiUITests]
    dependencies:
      - target: Yui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yui
