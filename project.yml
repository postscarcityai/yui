name: Yui
options:
  bundleIdPrefix: com.yuigui
  deploymentTarget:
    iOS: "26.0"
packages:
  YuiLines:
    path: Packages/YuiLines
  # Native LaTeX (CoreText) for math, step and calc. MIT.
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ${YUI_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  Yui:
    type: application
    platform: iOS
    sources: [Yui/Sources, Yui/Resources, Shared]
    dependencies:
      - package: YuiLines
      - package: SwiftMath
      - target: YuiWidgets
    entitlements:
      path: Yui/Yui.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Invite links yuigui.com/i/<code> open the app (YUI-56); the site serves
        # /.well-known/apple-app-site-association.
        com.apple.developer.associated-domains: ["applinks:www.yuigui.com", "applinks:yuigui.com"]
        # Xcode signs Debug with development; archive/export for TestFlight turns it into production.
        aps-environment: development
    info:
      path: Yui/Info.plist
      properties:
        CFBundleDisplayName: Yui
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A running timer on the lock screen and in the Dynamic Island (YUI-30).
        NSSupportsLiveActivities: true
        # Keeps a running timer's rounds and beeps going with the phone locked.
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Send a photo to an agent, or take one when it asks, like your plate or a receipt. Yui sends it only to the agent in that thread.
        NSMicrophoneUsageDescription: Hold the mic to talk to your agent. Yui turns your words into text on your phone and sends the text.
        NSSpeechRecognitionUsageDescription: Hold the mic to talk to your agent. Your words become text on your phone before they are sent.
        # yui://agent/<id>/thread opens that agent's thread (push taps, links from other channels).
        CFBundleURLTypes:
          - CFBundleURLName: com.yuigui.app
            CFBundleURLSchemes: [yui]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [YuiTests, YuiUITests]
  # Live Activities: the timer on the lock screen and in the Dynamic Island (YUI-30).
  YuiWidgets:
    type: app-extension
    platform: iOS
    sources: [YuiWidgets, Shared, Yui/Sources/Theme/YuiTheme.swift]
    info:
      path: YuiWidgets/Info.plist
      properties:
        CFBundleDisplayName: Yui
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  # Unit tests hosted in the app (the chat store, answers on reopen).
  YuiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YuiTests]
    dependencies:
      - target: Yui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  YuiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YuiUITests]
    dependencies:
      - target: Yui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuigui.app.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yui
