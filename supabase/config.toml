# Only what `supabase functions deploy` reads. yuigui (ref txuibjxyfpalzvpneqgp)
# is Yui's own project (it moved out of PROOF, the PSAI portal, Sep 27 2026).
# Never `supabase config push` from here. Apply migrations by hand.
project_id = "txuibjxyfpalzvpneqgp"

# Every Yui function verifies its own tokens: the gateway would expect a
# Supabase Auth JWT, and Yui users are not Supabase Auth users.
[functions.yui-auth]
verify_jwt = false

[functions.yui-delete]
verify_jwt = false

[functions.yui-agents]
verify_jwt = false

[functions.yui-connect]
verify_jwt = false

[functions.yui-push]
verify_jwt = false

[functions.yui-mcp]
verify_jwt = false

[functions.yui-oauth]
verify_jwt = false

[functions.yui-account]
verify_jwt = false

# NATIVE-1: called by the database (pg_net) with its own secret header.
[functions.yui-native]
verify_jwt = false
